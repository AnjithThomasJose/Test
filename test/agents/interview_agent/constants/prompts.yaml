##########################################
# INTERVIEW SUMMARY GENERATION
##########################################
interview_summary_prompt: |
  Generate a clear and structured interview summary.

  INPUT:
  - Candidate: {candidate_name}
  - Job: {job_title}
  - Q Count: {question_count}
  - Topics: {topics_discussed}
  - Evaluation: {evaluation_summary}

  RULES:
  - Concise and structured
  - No hallucinations
  - Avoid generic fluff

##########################################
# CANDIDATE-FACING INTERVIEW REPORT
##########################################
interview_report_prompt: |
  You are generating a CANDIDATE-FACING FEEDBACK REPORT. This is personalized, actionable feedback to help the candidate improve.

  IMPORTANT: This report is for the CANDIDATE, not a recruiter. Be helpful, constructive, clear, and avoid corporate fluff.

  INPUT DATA:
  - Overall Score: {overall_score}
  - Technical Score: {technical_score}
  - Problem Solving Score: {problem_solving_score}
  - Communication Score: {communication_score}
  - Experience Relevance Score: {experience_relevance_score}
  - Cultural Fit Score: {cultural_fit_score}
  - Interview Topic: {interview_topic}
  - Interview Phase: {interview_phase}
  - Number of Answers Evaluated: {num_answers}
  - Per-Answer Data: {per_answer_data}
  - Weakness Patterns: {weakness_patterns}
  - Strength Patterns: {strength_patterns}
  - Conversation History: {compressed_history}

  CRITICAL SAFETY RULES:
  - NEVER hallucinate resources, technologies, or concepts not mentioned by the candidate
  - NEVER invent experience the candidate didn't mention
  - NEVER overpraise without evidence
  - ALWAYS tie feedback to actual candidate answers
  - If data is missing, admit uncertainty and offer general guidance
  - NO invented technical claims
  - NO invented challenges or projects

  TONE REQUIREMENTS:
  - Helpful and constructive
  - Clear and direct
  - Personal (never generic)
  - Encouraging but honest
  - Not corporate or robotic

  PER-ANSWER FEEDBACK RULES:
  - For each answer, provide specific feedback
  - "correct_what_was_good" must reference actual words/concepts from their answer
  - "missing_what_was_incomplete" must identify real gaps, not invented ones
  - "ideal_answer" must be realistic and achievable, not overly complex
  - "skill_level" must match their demonstrated knowledge

  SKILL BREAKDOWN RULES:
  - Break down skills relevant to {interview_topic}
  - Each skill must have: score (0-100), explanation, improvement_suggestions
  - Suggestions must be actionable and measurable
  - Base scores on actual performance, not assumptions

  IMPROVEMENT PLAN RULES:
  - Create a realistic 7-day plan
  - Each day must have specific, actionable activities
  - Activities must address actual weaknesses identified
  - Progress from fundamentals to advanced practice
  - Day 7 should be review/consolidation

  STUDY RESOURCES RULES:
  - Provide 3-5 REAL, verified resources
  - Prefer well-known resources (MDN, official docs, popular YouTube channels)
  - If you don't know a specific URL, use "Search for: [specific terms]"
  - NEVER invent resource titles or URLs
  - Each resource must directly address identified weaknesses

  FINAL RECOMMENDATION RULES:
  - Must be one of: Beginner, Intermediate, Advanced, Ready for next round
  - Base on overall_score and demonstrated knowledge
  - Be honest but encouraging

##########################################
# BRIEF CANDIDATE SUMMARY (SHORT MODE)
##########################################
brief_summary_prompt: |
  Create a short, candidate-facing feedback summary (5–6 sentences max).

  HISTORY:
  {compressed_history}

  SCORES:
  - Overall: {overall_score}
  - Technical: {technical_score}
  - Problem Solving: {problem_solving_score}
  - Communication: {communication_score}

  RULES:
  - Write directly to the candidate (use "you", "your")
  - Must be concise but helpful
  - No hallucinations
  - Must include: overall impression, what went well, what needs work, next steps
  - Be constructive and encouraging
  - Tie feedback to actual answers

##########################################
# NARRATIVE REPORT PROMPT (SIMPLE TEXT ONLY)
##########################################
narrative_report_prompt: |
  Write a factual, concise, structured narrative summary of the interview.

  DO NOT infer scores.
  DO NOT produce strengths or weaknesses.
  DO NOT produce bullet lists unless necessary.
  Keep it factual, chronological, and based ONLY on the compressed history below.

  COMPRESSED HISTORY:
  {compressed_history}

##########################################
# STRUCTURED INTERVIEW REPORT (UI-FORMATTED)
##########################################
structured_interview_report_prompt: |
  You are generating a structured interview report that will be displayed in a UI. Generate a JSON object matching the exact format below.

  INPUT DATA:
  - Overall Score: {overall_score}
  - Category Scores: {category_scores}
  - Strengths: {strengths}
  - Weaknesses: {weaknesses}
  - Summary: {summary}
  - Job Title: {job_title}
  - Interview Topic: {interview_topic}
  - Conversation History: {compressed_history}

  OUTPUT FORMAT (MANDATORY JSON):
  {{
    "overall_interview_signal": {{
      "level": "string - e.g., 'Strong senior-level readiness', 'Good mid-level performance', 'Needs improvement'",
      "description": "string - 2-3 sentences describing overall performance and readiness level"
    }},
    "key_skill_breakdowns": [
      {{
        "skill": "string - MUST be a skill relevant to the interview topic (see rules)",
        "rating": "ONLY one of: 'Strong', 'Clear', 'High'",
        "description": "string - 1 sentence describing performance in this skill"
      }},
      {{
        "skill": "string - MUST be a skill relevant to the interview topic (see rules)",
        "rating": "ONLY one of: 'Strong', 'Clear', 'High'",
        "description": "string - 1 sentence describing performance in this skill"
      }},
      {{
        "skill": "string - MUST be a skill relevant to the interview topic (see rules)",
        "rating": "ONLY one of: 'Strong', 'Clear', 'High'",
        "description": "string - 1 sentence describing performance in this skill"
      }}
    ],
    "observed_strengths": [
      "string - specific strength observed",
      "string - specific strength observed",
      "string - specific strength observed"
    ],
    "improvement_opportunities": [
      "string - specific area for improvement",
      "string - specific area for improvement",
      "string - specific area for improvement"
    ],
    "personalized_recommendations": [
      "string - actionable recommendation",
      "string - actionable recommendation",
      "string - actionable recommendation"
    ]
  }}

  RULES:
  - overall_interview_signal.level: Must be a concise phrase indicating readiness level (e.g., "Strong senior-level readiness", "Good mid-level performance", "Needs improvement")
  - overall_interview_signal.description: Must be 2-3 sentences that explain the level and provide context
  - key_skill_breakdowns: Exactly 3 skills, each MUST be relevant to the Interview Topic ({interview_topic}). Do NOT use generic skills like "Problem Solving", "Communication", "Decision Judgment" unless the interview topic is explicitly about those. Instead, choose 3 key competencies for that topic. Examples:
    * For "Menu Development & Engineering" → e.g. "Menu Design & Engineering", "Operational Knowledge", "Customer Focus"
    * For "Communication" or "Communication Test" → e.g. "Clarity", "Structure", "Listening"
    * For "Backend / Platform Engineering" → e.g. "System Design", "Technical Depth", "Scalability"
    * For "Leadership" → e.g. "Decision Making", "Team Influence", "Strategic Thinking"
    * For any other topic: derive 3 short, relevant skill names (2-4 words each) that match what was assessed in the conversation.
  - Map category_scores to these topic-relevant skills: use problem_solving/technical for first skill, communication for second, experience_relevance/cultural_fit for third when mapping scores to ratings.
  - Rating for each skill MUST be exactly one of: "Strong", "Clear", "High" only. Do not use "Moderate" or "Needs Improvement".
  - observed_strengths: REQUIRED - Generate 3-5 specific strengths based on actual conversation history. If input strengths list is empty, analyze the conversation history to identify positive aspects (e.g., "Senior-level framing of technical decisions", "Clear ownership and accountability", "Good balance of engineering and business considerations"). NEVER return an empty array.
  - improvement_opportunities: 3-5 specific, actionable areas for improvement. Use format like "Add quantified outcomes (metrics, scale, cost impact)", "Explicitly state alternatives you rejected and why", "Clarify scope (team vs system vs org-level ownership)". Be specific and actionable, not generic.
  - personalized_recommendations: 3-5 actionable recommendations matching format like "Attempt 1-2 mock interviews focused on system design depth", "Review sample Staff/Principal-level answer patterns", "Book a mentor session to refine leadership stories". Be specific and actionable.
  - NEVER hallucinate - all content must be based on actual conversation history and evaluation scores
  - Be specific and actionable - avoid generic statements like "Provide more detailed answers" or "Improve communication"
  - Use professional but friendly tone

##########################################
# STATE TRANSITION GUIDANCE
##########################################
state_transition_guidance_prompt: |
  Recommend the next interview state.

  CONTEXT:
  - Current state: {current_state}
  - Question count: {question_count}
  - Engagement: {engagement_level}
  - Coverage: {coverage_score}
  - Topics: {topics_discussed}
  - Quality: {response_quality}

  RULES:
  - Do NOT transition to COMPLETED before minimum coverage
  - Must justify reasoning
  - No hallucinations
