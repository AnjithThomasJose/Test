[pytest]
# Issue 7.1 & 7.4: LangGraph workflow test configuration with CI support

# Async mode for pytest-asyncio
asyncio_mode = auto

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeout for individual tests (seconds)
timeout = 60
timeout_method = thread

# Default options
addopts = -v --tb=short --strict-markers

# Markers for selective test execution
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    asyncio: marks tests as async tests
    smoke: quick smoke tests for CI
    unit: unit tests (default)
    evaluation: evaluation harness tests

# Ignore warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging configuration for debugging
log_cli = false
log_cli_level = INFO

# JUnit XML output for CI
junit_family = xunit2
