<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Trackers</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding: 56px 16px 32px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 34px; font-weight: 800; text-align: center; margin-bottom: 32px; }
  .card {
    display: flex; align-items: center; gap: 18px;
    background: #1c1c1e; border-radius: 20px;
    padding: 24px 20px; margin-bottom: 14px;
    color: inherit; text-decoration: none;
    transition: background .15s;
  }
  .card:active, .card:hover { background: #2c2c2e; }
  .icon {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0;
  }
  .card h2 { font-size: 20px; font-weight: 700; }
  .card p { color: #8e8e93; font-size: 14px; margin-top: 2px; }
  .chev { margin-left: auto; color: #8e8e93; font-size: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Trackers</h1>
  <a class="card" href="/workout/">
    <div class="icon" style="background:#2a3311">🏋️</div>
    <div><h2>Workout</h2><p>Hybrid split plan &amp; logs</p></div>
    <span class="chev">›</span>
  </a>
  <a class="card" href="/finance/">
    <div class="icon" style="background:#13302c">💸</div>
    <div><h2>Finance</h2><p>Expenses, budget &amp; analytics</p></div>
    <span class="chev">›</span>
  </a>
</div>
</body>
</html>
