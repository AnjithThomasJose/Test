name: SonarQube Scan

on:
  push:
    branches: [develop]

jobs:
  sonarQubeAnalysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ✅ Full clone for SonarQube blame info

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12  # The version of python our project uses

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true  # ignore if no file

      - name: SonarQube Scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          npm install -g sonar-scanner
          sonar-scanner \
            -Dsonar.projectKey=agents \
            -Dsonar.sources=. \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.python.version=3.12 \
            -Dsonar.security.enable=false \
            -Dsonar.security.hotspot.enable=false \
            -Dsonar.security.analysis=false \
            -Dsonar.security.sast.enabled=false
